<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">1000 个向量元素到四个 CUDA Block 的映射</title>
  <desc id="desc">每个 Block 有 256 个线程。Block 0 到 Block 2 各处理 256 个元素；Block 3 处理剩余的 232 个元素，其余 24 个线程通过边界判断跳过。</desc>
  <rect width="960" height="300" fill="#f4f8ed"/>
  <text x="30" y="38" fill="#1c5135" font-family="Arial, sans-serif" font-size="17" font-weight="700">n = 1000，blockDim.x = 256，gridDim.x = 4</text>
  <text x="30" y="75" fill="#44664c" font-family="Arial, sans-serif" font-size="14">全局索引 i = blockIdx.x × 256 + threadIdx.x</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="30" y="105" width="211" height="80" rx="11" fill="#deedda" stroke="#87b082" stroke-width="2"/>
    <text x="135" y="135" fill="#1c5437" font-size="17" font-weight="700">Block 0</text><text x="135" y="163" fill="#365b40" font-size="14">i = 0–255</text>
    <rect x="256" y="105" width="211" height="80" rx="11" fill="#deedda" stroke="#87b082" stroke-width="2"/>
    <text x="361" y="135" fill="#1c5437" font-size="17" font-weight="700">Block 1</text><text x="361" y="163" fill="#365b40" font-size="14">i = 256–511</text>
    <rect x="482" y="105" width="211" height="80" rx="11" fill="#deedda" stroke="#87b082" stroke-width="2"/>
    <text x="587" y="135" fill="#1c5437" font-size="17" font-weight="700">Block 2</text><text x="587" y="163" fill="#365b40" font-size="14">i = 512–767</text>
    <rect x="708" y="105" width="221" height="80" rx="11" fill="#deedda" stroke="#87b082" stroke-width="2"/>
    <rect x="908" y="106" width="20" height="78" rx="7" fill="#e9e2cf"/>
    <text x="818" y="135" fill="#1c5437" font-size="17" font-weight="700">Block 3</text><text x="818" y="163" fill="#365b40" font-size="14">i = 768–999</text>
  </g>
  <path d="M918 191 V217" stroke="#8c7b58" stroke-width="2"/>
  <text x="508" y="241" fill="#705c39" font-family="Arial, sans-serif" font-size="14">灰色：24 个线程算出 i ≥ 1000，跳过读写</text>
  <text x="30" y="273" fill="#53705a" font-family="Arial, sans-serif" font-size="13">最后一块仍启动完整的 256 个线程，因此 Kernel 必须检查 i &lt; n。</text>
</svg>
