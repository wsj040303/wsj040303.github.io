<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 480" role="img" aria-labelledby="title desc">
<title id="title">解码时块边界与空闲块要求</title>
<desc id="desc">块大小为四。序列长度四时当前块仍容纳最后一个 token；长度五时最后一个 token 落在新块，需要一个空闲块；长度六时继续使用第二块。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#3e7851" stroke-width="1.8"/></marker></defs>
<rect x="8" y="8" width="1124" height="464" rx="24" fill="#fffdf7" stroke="#cbdcc4" stroke-width="2"/>
<text x="52" y="62" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="750" fill="#1b5136" text-anchor="start">块大小为 4：哪一步真的需要新块？</text>
<text x="52" y="95" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="470" fill="#52705b" text-anchor="start">decode 处理序列中的最后一个 token；它可能是刚采样、尚未写入 KV 的 token。</text>
<rect x="143" y="126" width="268" height="278" rx="14" fill="#f4f8ee" stroke="#bed5b7" stroke-width="2"/>
<text x="160" y="164" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#1b5136" text-anchor="start">len = 4</text>
<text x="160" y="194" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="520" fill="#52705b" text-anchor="start">4 % 4 = 0</text>
<rect x="160" y="225" width="43" height="47" rx="7" fill="#dcefd5" stroke="#a6c99d" stroke-width="2"/>
<text x="181" y="256" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#1b5136" text-anchor="middle">1</text>
<rect x="212" y="225" width="43" height="47" rx="7" fill="#dcefd5" stroke="#a6c99d" stroke-width="2"/>
<text x="233" y="256" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#1b5136" text-anchor="middle">2</text>
<rect x="264" y="225" width="43" height="47" rx="7" fill="#dcefd5" stroke="#a6c99d" stroke-width="2"/>
<text x="285" y="256" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#1b5136" text-anchor="middle">3</text>
<rect x="316" y="225" width="43" height="47" rx="7" fill="#dcefd5" stroke="#a6c99d" stroke-width="2"/>
<text x="337" y="256" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#1b5136" text-anchor="middle">4</text>
<text x="161" y="316" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="500" fill="#52705b" text-anchor="start">同一物理块</text>
<text x="160" y="360" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="560" fill="#1b5136" text-anchor="start">当前块还有第 4 个位置</text>
<text x="160" y="387" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1b5136" text-anchor="start">无需新块</text>
<rect x="433" y="126" width="268" height="278" rx="14" fill="#f4f8ee" stroke="#bed5b7" stroke-width="2"/>
<text x="450" y="164" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#1b5136" text-anchor="start">len = 5</text>
<text x="450" y="194" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="520" fill="#52705b" text-anchor="start">5 % 4 = 1</text>
<rect x="450" y="225" width="43" height="47" rx="7" fill="#dcefd5" stroke="#a6c99d" stroke-width="2"/>
<text x="471" y="256" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#1b5136" text-anchor="middle">1</text>
<rect x="502" y="225" width="43" height="47" rx="7" fill="#dcefd5" stroke="#a6c99d" stroke-width="2"/>
<text x="523" y="256" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#1b5136" text-anchor="middle">2</text>
<rect x="554" y="225" width="43" height="47" rx="7" fill="#dcefd5" stroke="#a6c99d" stroke-width="2"/>
<text x="575" y="256" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#1b5136" text-anchor="middle">3</text>
<rect x="606" y="225" width="43" height="47" rx="7" fill="#dcefd5" stroke="#a6c99d" stroke-width="2"/>
<text x="627" y="256" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#1b5136" text-anchor="middle">4</text>
<rect x="450" y="285" width="43" height="47" rx="7" fill="#dceaf0" stroke="#abcbd3" stroke-width="2"/>
<text x="471" y="316" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#1b5136" text-anchor="middle">5</text>
<text x="450" y="360" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="560" fill="#1b5136" text-anchor="start">第 5 个 token 属于新块</text>
<text x="450" y="387" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1b5136" text-anchor="start">空闲块 ≥ 1</text>
<rect x="723" y="126" width="268" height="278" rx="14" fill="#f4f8ee" stroke="#bed5b7" stroke-width="2"/>
<text x="740" y="164" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#1b5136" text-anchor="start">len = 6</text>
<text x="740" y="194" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="520" fill="#52705b" text-anchor="start">6 % 4 = 2</text>
<rect x="740" y="225" width="43" height="47" rx="7" fill="#dcefd5" stroke="#a6c99d" stroke-width="2"/>
<text x="761" y="256" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#1b5136" text-anchor="middle">1</text>
<rect x="792" y="225" width="43" height="47" rx="7" fill="#dcefd5" stroke="#a6c99d" stroke-width="2"/>
<text x="813" y="256" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#1b5136" text-anchor="middle">2</text>
<rect x="844" y="225" width="43" height="47" rx="7" fill="#dcefd5" stroke="#a6c99d" stroke-width="2"/>
<text x="865" y="256" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#1b5136" text-anchor="middle">3</text>
<rect x="896" y="225" width="43" height="47" rx="7" fill="#dcefd5" stroke="#a6c99d" stroke-width="2"/>
<text x="917" y="256" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#1b5136" text-anchor="middle">4</text>
<rect x="740" y="285" width="43" height="47" rx="7" fill="#dceaf0" stroke="#abcbd3" stroke-width="2"/>
<text x="761" y="316" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#1b5136" text-anchor="middle">5</text>
<rect x="792" y="285" width="43" height="47" rx="7" fill="#dceaf0" stroke="#abcbd3" stroke-width="2"/>
<text x="813" y="316" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#1b5136" text-anchor="middle">6</text>
<text x="740" y="360" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="560" fill="#1b5136" text-anchor="start">第二块已经分配</text>
<text x="740" y="387" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1b5136" text-anchor="start">无需再取新块</text>
<path d="M414 259 L426 259" fill="none" stroke="#3e7851" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M704 259 L716 259" fill="none" stroke="#3e7851" stroke-width="3" marker-end="url(#arrow)"/>
<text x="51" y="453" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="560" fill="#1b5136" text-anchor="start">布尔表达式为 True 时等于 1，can_append 要求至少 1 个空闲块；may_append 随后真正分配。</text>
</svg>
