<text x="48" y="578" font-family="Inter, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="550" fill="#1b5136" text-anchor="start">权重的列数保持 1024；这里拼接权重的行，相应地把输出特征拼到最后一维。</text>
