<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 382" role="img" aria-labelledby="title desc">
  <title id="title">运行队列取出与尾部抢占</title>
  <desc id="desc">运行队列 A B C D 经 popleft 暂取 A，队列变成 B C D；随后 pop 从队尾取 D。</desc>
  <defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#3e7851" stroke-width="1.7"/></marker></defs>
  <rect x="8" y="8" width="1204" height="366" rx="24" fill="#fffdf7" stroke="#cbdcc4" stroke-width="2"/>
  <text x="52" y="59" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="750" fill="#1b5136" text-anchor="start">先取出队头 A，再决定是否从队尾抢占</text>
  <text x="52" y="92" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#52705b" text-anchor="start">running 的两端各有用途：队头是候选，队尾是可能让出资源的请求。</text>
  <rect x="48" y="122" width="342" height="196" rx="14" fill="#f4f8ee" stroke="#bed5b7" stroke-width="2"/>
  <text x="68" y="159" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#1b5136" text-anchor="start">① 取出前</text>
  <text x="68" y="192" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="550" fill="#52705b" text-anchor="start">running</text>
  <rect x="438" y="122" width="342" height="196" rx="14" fill="#f4f8ee" stroke="#bed5b7" stroke-width="2"/>
  <text x="458" y="159" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#1b5136" text-anchor="start">② popleft() 后</text>
  <text x="458" y="192" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="550" fill="#52705b" text-anchor="start">seq = A</text>
  <rect x="828" y="122" width="342" height="196" rx="14" fill="#f4f8ee" stroke="#bed5b7" stroke-width="2"/>
  <text x="848" y="159" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#1b5136" text-anchor="start">③ pop() 时</text>
  <text x="848" y="192" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="550" fill="#52705b" text-anchor="start">被抢占候选 = D</text>
  <rect x="70" y="215" width="58" height="48" rx="10" fill="#e6f2df" stroke="#a9c99d" stroke-width="1.5"/>
  <text x="99.0" y="247" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#1b5136" text-anchor="middle">A</text>
  <rect x="139" y="215" width="58" height="48" rx="10" fill="#e6f2df" stroke="#a9c99d" stroke-width="1.5"/>
  <text x="168.0" y="247" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#1b5136" text-anchor="middle">B</text>
  <rect x="208" y="215" width="58" height="48" rx="10" fill="#e6f2df" stroke="#a9c99d" stroke-width="1.5"/>
  <text x="237.0" y="247" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#1b5136" text-anchor="middle">C</text>
  <rect x="277" y="215" width="58" height="48" rx="10" fill="#e6f2df" stroke="#a9c99d" stroke-width="1.5"/>
  <text x="306.0" y="247" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#1b5136" text-anchor="middle">D</text>
  <rect x="460" y="215" width="58" height="48" rx="10" fill="#e6f2df" stroke="#a9c99d" stroke-width="1.5"/>
  <text x="489.0" y="247" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#1b5136" text-anchor="middle">B</text>
  <rect x="529" y="215" width="58" height="48" rx="10" fill="#e6f2df" stroke="#a9c99d" stroke-width="1.5"/>
  <text x="558.0" y="247" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#1b5136" text-anchor="middle">C</text>
  <rect x="598" y="215" width="58" height="48" rx="10" fill="#e6f2df" stroke="#a9c99d" stroke-width="1.5"/>
  <text x="627.0" y="247" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#1b5136" text-anchor="middle">D</text>
  <rect x="850" y="215" width="58" height="48" rx="10" fill="#e6f2df" stroke="#a9c99d" stroke-width="1.5"/>
  <text x="879.0" y="247" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#1b5136" text-anchor="middle">B</text>
  <rect x="919" y="215" width="58" height="48" rx="10" fill="#e6f2df" stroke="#a9c99d" stroke-width="1.5"/>
  <text x="948.0" y="247" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#1b5136" text-anchor="middle">C</text>
  <path d="M400 220 L430 220" fill="none" stroke="#3e7851" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M790 220 L820 220" fill="none" stroke="#3e7851" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="48" y="353" font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="600" fill="#1b5136" text-anchor="start">A 此时保存在局部变量 seq；self.running.pop() 只能从余下请求里取 D。</text>
</svg>
