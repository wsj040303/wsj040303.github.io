<text x="42" y="93" font-family="Inter, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#52705b" text-anchor="start">依据 Nano-vLLM qwen3.py 与 Qwen3 官方资料绘制；层数和维度由配置决定。</text>
