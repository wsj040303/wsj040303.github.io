<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1115" role="img" aria-labelledby="title desc"><title id="title">Qwen3注意力和SwiGLU内部结构</title><desc id="desc">Attention把隐藏状态投影并拆为QKV，QK归一化和RoPE后执行因果GQA，再展平和输出投影；MLP用gate/up投影、SiLU逐元素门控与down投影。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#3e7851" stroke-width="1.8"/></marker></defs>
