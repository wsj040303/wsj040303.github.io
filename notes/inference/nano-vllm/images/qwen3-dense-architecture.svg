<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1020" role="img" aria-labelledby="title desc"><title id="title">Qwen3稠密模型整体结构</title><desc id="desc">左侧为token输入经Embedding、L层Decoder和最终RMSNorm再由LMHead输出logits；右侧展开每层的两次前归一化、Attention、MLP与残差。采样在模型之外。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#3e7851" stroke-width="1.8"/></marker></defs>
